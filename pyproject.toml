[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "theotown-city-parser"
version = "1.1.0"
description = "Read-only parser for TheoTown .city save files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["Pillow"]

[project.scripts]
theotown-city = "theotown_city.cli:main"

[tool.setuptools.packages.find]
include = ["theotown_city*"]
